name: Goldfish checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Establish main baseline
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - name: Tests, release build, and signature
        run: ./scripts/check.sh
